<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Logout </title>
    <!-- fav-icon -->
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon">
    <!-- tailwind+daisy -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- google font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<!-- google font icon -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
    *{
         font-family: "Outfit", sans-serif;
    }
</style>
<body class="min-h-screen max-w-md bg-[#F4F5F7] mx-auto">
   <header class="border-b-2 bg-gray-200 ">
    <section class="w-11/12 mx-auto py-3 flex justify-between items-center ">
        <div class="left flex gap-1">
            <div class="logo w-[60px]">
                <img src="./logo.png" alt="">
            </div>
            <div class="info-balance">
                <h2 class="text-2xl font-bold">$<span id="balance">45000</span></h2>
                <p class=" text-neutral/50">Available Balance</p>
            </div>
        </div>
        <div class="right">
          <a href="./index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
        </div>
    </section>
   </header>
    <section class="w-11/12 mx-auto pt-10 space-y-5">
        <h2 class="font-bold text-3xl ">Welcome to pay<span class="text-primary">oo</span></h2>
        <p class=" text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and</p>
       <div class="buttons grid grid-cols-3 gap-3">
        <button class="btn btn-soft h-full flex-col p-4">
            <img src="./opt-1.png" alt="">
            <p>Add money</p>
        </button>
        <button class="btn btn-soft h-full flex-col p-4">
            <img src="./opt-2.png" alt="">
            <p>Cashout</p>
        </button>
        <button class="btn btn-soft h-full flex-col p-4">
            <img src="./opt-3.png" alt="">
            <p>Transfer Money</p>
        </button>
        <button class="btn btn-soft h-full flex-col p-4">
            <img src="./opt-4.png" alt="">
            <p>Get Bonus</p>
        </button>
        <button class="btn btn-soft h-full flex-col p-4">
            <img src="./opt-5.png" alt="">
            <p>Pay Bill</p>
        </button>
        <button class="btn btn-soft h-full flex-col p-4">
            <img src="./opt-6.png" alt="">
            <p>Transactions</p>
        </button>
       </div>
    </section>

  
</body>
</html>
