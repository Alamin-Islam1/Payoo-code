<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login </title>
    <!-- fav-icon -->
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon">
    <!-- tailwind+daisy -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- google font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<!-- google font icon -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
    *{
         font-family: "Outfit", sans-serif;
    }
</style>
<body class="min-h-screen max-w-md bg-[#F4F5F7] mx-auto">
   
    <div class="logo max-w-[260px] mx-auto pt-24">
        <img src="./Logo-full.png" alt="">
    </div>
    <!-- form section -->
    <div class="form pt-12">
      <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-sm mx-auto rounded-xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold">Mobile Number</label>
          <input id="input-number" minlength="11" maxlength="11" type="text" value="01701453961" class="input rounded-full bg-neutral-200" placeholder="Enter your number" />
          <label  class="label text-neutral font-bold">4 Digit Pin</label>
          <input id="input-pin" minlength="4" maxlength="4" type="password" class="input rounded-full bg-neutral-200" placeholder="Enter 4 Digit Pin" />
          
          <button id="input-btn" class="btn btn-neutral mt-4 rounded-full">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
  <script src="./login.js"></script>
</body>
</html>
